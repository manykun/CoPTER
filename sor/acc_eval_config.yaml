# ACC baseline evaluation config for short ns-3 comparison
# Use with: TRAIN_CONFIG=/root/paddlejob/workspace/yangziwen/CoPTER/sor/acc_eval_config.yaml copter/run_train.sh

total_epochs: 120
exp_name: eval_acc_baseline
mode: ACC
model_dir: eval_models_acc_baseline

ns3_port: 5558
ns3_conf: simulation/mix/acc_Hadoop_Shuffle.conf
ns3_dir: ns-3.33
ns3_binary: ns-3.33/build/scratch/copter-sim
ns3_log_level: level_all
ns3_inter_run_sleep: 5

static_steps: 4
train_intervals: 8
switch_buffer: 10000
max_steps: 0

epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_steps: 50000
state_save_interval: 1
seed: 1

convergence:
  enable: false
  reward_window: 5
  reward_delta: 0.005
  min_epochs: 10

tensorboard:
  enable: true
  log_dir: tb_logs_acc
  flush_secs: 30
