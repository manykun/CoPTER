# ============================================================
# SOR-ACC continuous training config
# Agent side: sor/run_sor_train.sh
# NS3 side can reuse simulation/run_train.sh with TRAIN_CONFIG pointing here.
# ============================================================

total_epochs: 100
exp_name: experiment_sor_acc_continuous
model_dir: sor_models

ns3_port: 5558
ns3_conf: simulation/mix/copter_Hadoop_Shuffle.conf
ns3_dir: ns-3.33
ns3_binary: ns-3.33/build/scratch/copter-sim
ns3_log_level: level_all
ns3_inter_run_sleep: 5

static_steps: 4
train_intervals: 8
switch_buffer: 10000
max_steps: 0

epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_steps: 50000
state_save_interval: 1

sor:
  recent_size: 2000
  boundary_size: 20000
  max_clusters: 32
  prototype_distance: 1.0
  prototype_eta: 0.05
  boundary_threshold: 0.5
  alpha_td: 1.0
  beta_under_sample: 0.2
  gamma_drift: 0.5
  rho_boundary: 0.5
  temperature: 1.0
  lambda_cons: 0.01
  lambda_reg: 0.001
  drift_reg_threshold: 0.5
  ref_update_interval: 256

convergence:
  enable: true
  reward_window: 5
  reward_delta: 0.005
  min_epochs: 10

tensorboard:
  enable: true
  log_dir: tb_logs
  flush_secs: 30
